name: ecmobile
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
    # --- THÊM THƯ VIỆN NÀY ĐỂ GỌI API ---
  http: ^1.6.0 # (hoặc phiên bản mới hơn)
  flutter_displaymode: ^0.6.0
    # ---
  google_generative_ai: ^0.4.7 # Kiểm tra phiên bản mới nhất nếu có
  image_picker: ^1.0.4  # Thêm thư viện này để chọn ảnh
  flutter_launcher_icons: "^0.13.1" # <--- THÊM DÒNG NÀY
  cupertino_icons: ^1.0.8
    # --- 2 thư vien thanh toan ---
  random_string: ^2.3.1
  flutter_spinkit: ^5.2.0
    # ---
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  shared_preferences: ^2.2.2
  firebase_auth: ^6.1.2
  google_sign_in: ^6.2.1

  firebase_storage: ^13.0.4

dev_dependencies:
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter


  intl: ^0.18.0
  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true
  assets:
    - assets/images/


dependency_overrides:
  carousel_slider:
    git:
      url: https://github.com/serenader2014/flutter_carousel_slider.git
      ref: master

carousel_slider: ^4.2.1
firebase_core: ^2.27.0
cloud_firestore: ^4.15.8
intl: ^0.19.0
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_darter.png"
  min_sdk_android: 21 # SDK tối thiểu của Android.

